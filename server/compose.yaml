name: sow-server-stage2
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sow_prototype
      POSTGRES_USER: sow_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local password in server/.env}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sow_local -d sow_prototype"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
  host:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Prototype__Enabled: "true"
      ConnectionStrings__Postgres: Host=postgres;Database=sow_prototype;Username=sow_local;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
    ports: ["127.0.0.1:5080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
volumes:
  postgres:
