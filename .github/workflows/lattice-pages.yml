name: Lattice map
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: write
  pages: write
  id-token: write
concurrency:
  group: lattice-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  map:
    uses: hyunlord/lattice/.github/workflows/lattice.yml@0a20ebe1d815fda262eb2b76ebb77ac96607ebec
    with:
      tool-ref: 0a20ebe1d815fda262eb2b76ebb77ac96607ebec
      history-ref: de2a5713ce7c9d9c9f38a663e0a1cae66bbfe5b5
      history-current-lens: true
      verification-script: .lattice/verify-ci.mjs
