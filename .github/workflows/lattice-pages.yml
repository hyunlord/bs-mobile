name: Lattice map
on:
  push:
    branches: [main]
    paths: ['data/**', '.lattice/**', '.github/workflows/lattice-pages.yml']
  pull_request:
    paths: ['data/**', '.lattice/**', '.github/workflows/lattice-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lattice-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: hyunlord/lattice
          ref: df2a47ab0875c053b7b0749ced07315eb54a0b44
          path: lattice-tool
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lattice-tool/package-lock.json
      - run: npm ci --ignore-scripts && npm run build
        working-directory: lattice-tool
      - name: Build source graph and static map
        run: |
          node lattice-tool/bin/lattice.mjs build --root source --lens .lattice/lens.json
          node lattice-tool/bin/lattice.mjs export "$RUNNER_TEMP/lattice-site" --root source
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ runner.temp }}/lattice-site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-map
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish map
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
