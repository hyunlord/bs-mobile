name: Lattice map
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: write
  pages: write
  id-token: write
concurrency:
  group: lattice-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  map:
    uses: hyunlord/lattice/.github/workflows/lattice.yml@9e4ab95f474662719ac3537ebdf8ccc5250c64d8
    with:
      tool-ref: 9e4ab95f474662719ac3537ebdf8ccc5250c64d8
      lfs: true
      history-ref: de2a5713ce7c9d9c9f38a663e0a1cae66bbfe5b5
      history-current-lens: true
      verification-script: .lattice/verify-ci.mjs
