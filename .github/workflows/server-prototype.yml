name: Server prototype
on:
  pull_request:
    paths: ['server/**', 'core/src/SowSiege.Content/**', 'core/src/SowSiege.Core/**', 'core/src/SowSiege.Sim/**', 'data/**', '.github/workflows/server-prototype.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-authority:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sow_test
          POSTGRES_USER: sow_test
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sow_test -d sow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: |
            8.0.x
            10.0.403
      - name: Unit and PostgreSQL transaction contracts
        working-directory: server
        env:
          SERVER_TEST_POSTGRES: Host=localhost;Database=sow_test;Username=sow_test;Password=ephemeral-ci-only
        run: dotnet test tests/SowSiege.Server.Tests --configuration Release --logger "console;verbosity=detailed"
