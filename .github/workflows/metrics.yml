name: Durable metrics
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: write
concurrency:
  group: durable-metrics
  cancel-in-progress: false
  queue: max
jobs:
  archive:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Publish bounded metrics history
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          METRICS_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node tools/durable-metrics.mjs
