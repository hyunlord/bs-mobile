name: Nightly
on:
  schedule:
    - cron: '17 17 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  league-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: ./tools/check.sh
      - run: ./tools/league.sh long
      - run: dotnet run -c Release --project core/bench/SowSiege.Bench -- --filter '*' --job short --exporters json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nightly-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/
            BenchmarkDotNet.Artifacts/
          retention-days: 90
