name: Nightly
on:
  schedule:
    - cron: '17 17 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  league-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false
          persist-credentials: false
      # LFS is fetched only for the full gate, from a cache keyed on the tracked object list (#601).
      - name: List LFS objects
        id: lfs-list
        run: |
          git lfs ls-files -l | cut -d' ' -f1 | sort > "$RUNNER_TEMP/lfs-ids"
          echo "hash=$(sha256sum "$RUNNER_TEMP/lfs-ids" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .git/lfs/objects
          key: lfs-${{ steps.lfs-list.outputs.hash }}
          restore-keys: lfs-
      - name: Fetch only uncached LFS objects
        run: |
          git lfs pull
          git lfs checkout
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: ./tools/check.sh
      - run: ./tools/league.sh long
      - run: dotnet run -c Release --project core/bench/SowSiege.Bench -- --filter '*' --job short --exporters json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: nightly-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/
            BenchmarkDotNet.Artifacts/
          retention-days: 90
