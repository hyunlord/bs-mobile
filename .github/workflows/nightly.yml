name: Nightly
on:
  schedule:
    - cron: '17 17 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  league-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false
          persist-credentials: false
      # LFS is fetched only for the full gate, from a cache keyed on the tracked object list (#601).
      - name: List LFS objects
        id: lfs-list
        run: |
          git lfs ls-files -l | cut -d' ' -f1 | sort > "$RUNNER_TEMP/lfs-ids"
          echo "hash=$(sha256sum "$RUNNER_TEMP/lfs-ids" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .git/lfs/objects
          key: lfs-${{ steps.lfs-list.outputs.hash }}
          restore-keys: lfs-
      - name: Fetch only uncached LFS objects
        run: |
          git lfs pull
          git lfs checkout
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: ./tools/check.sh
      - run: ./tools/league.sh long
      - run: dotnet run -c Release --project core/bench/SowSiege.Bench -- --filter '*' --job short --exporters json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nightly-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/
            BenchmarkDotNet.Artifacts/
          retention-days: 90
