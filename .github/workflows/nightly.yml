name: Nightly
on:
  schedule:
    - cron: '17 17 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  league-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: ./tools/check.sh
      - run: ./tools/league.sh long
      - run: dotnet run -c Release --project core/bench/SowSiege.Bench -- --filter '*' --job short --exporters json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nightly-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/
            BenchmarkDotNet.Artifacts/
          retention-days: 90
