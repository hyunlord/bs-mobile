          value:
            op: case
            cases:
              - when:
                  op: and
                  values:
                    - op: eq
                      left:
                        op: get
                        from: node
                        path:
                          - designRef
                          - catalog
                      right: data/system-design-v1.json
                    - op: eq
                      left:
                        op: get
                        from: node
                        path:
