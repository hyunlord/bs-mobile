                      left:
                        op: get
                        from: node
                        path:
                          - designRef
                          - id
                      right:
                        op: get
                        from: node
                        path:
                          - originalId
                value:
                  op: get
                  from: node
                  path:
                    - designRef
                    - id
            default: INVALID-DESIGN-REFERENCE
      default:
        op: get
        from: node
        path:
          - originalId
    targetKind: weapon
    targetField:
