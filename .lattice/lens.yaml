schemaVersion: 1
name: Sow & Siege · 콘텐츠 지도
kinds:
  - id: waveProgram
    label: wave-1a 실행 프로그램
    files: []
    selections:
      - files:
          - data/runtime/wave-1a.json
        records: /bindings
        layer: runtime-programs
        references: false
  - id: waveProgramCatalog
    label: 실행 프로그램 원본
    files: []
    hidden: true
    selections:
      - files:
          - data/runtime/wave-1a.json
        records: /definition
        idField: revision
        layer: runtime-programs
        references: false
  - id: runtimePrimitive
    label: 실행 동작 단위
    files: []
    columns:
      - name
      - staticSupport
      - limitation
    selections:
      - files:
          - docs/design/runtime-primitive-support.json
        records: /units
        layer: runtime-support
        references: false
  - id: weapon
    label: 무기
    files: []
    columns:
      - name
      - concept
    selections:
      - files:
          - data/weapons/*.json
        layer: runtime
  - id: tool
    label: 도구
    files: []
    columns:
      - name
      - concept
    selections:
      - files:
          - data/tools/*.json
        layer: runtime
  - id: charter
    label: 특허장
    files: []
    columns:
      - name
      - concept
    selections:
      - files:
          - data/charters/*.json
        layer: runtime
  - id: item
    label: 물품
    files: []
    columns:
      - name
      - concept
    selections:
      - files:
          - data/items/*.json
        layer: runtime
  - id: evolution
    label: 진화
    files: []
    columns:
      - name
      - concept
    selections:
      - files:
          - data/evolutions/*.json
        layer: runtime
  - id: enemy
    label: 적
    files: []
    columns:
      - name
      - concept
    selections:
      - files:
          - data/enemies/*.json
        layer: runtime
  - id: vassal
    label: 가신
    files: []
    columns:
      - name
      - concept
    selections:
      - files:
          - data/vassals/*.json
        layer: candidate
        references: false
      - files:
          - data/meta/progression.json
        records: /vassals
        layer: runtime
  - id: profile
    label: 실행 프로필
    files: []
    hidden: true
    selections:
      - files:
          - data/profiles/first-playable.json
        layer: runtime
  - id: material
    label: 재료
    files: []
    selections:
      - files:
          - data/meta/progression.json
        records: /materials
        layer: runtime
  - id: chapter
    label: 챕터
    files: []
    selections:
      - files:
          - data/meta/progression.json
        records: /chapters
        layer: runtime
  - id: manor
    label: 장원
    files: []
    selections:
      - files:
          - data/meta/progression.json
        records: /manorBuildings
        layer: runtime
  - id: challenge
    label: 도전
    files: []
    selections:
      - files:
          - data/meta/progression.json
        records: /challenges
        layer: runtime
  - id: content
    label: 설계 콘텐츠
    files: []
    selections:
      - files:
          - data/system-design-v1.json
        records: /content
        kindField: kind
        layer: designed-v1
        references: false
        namespaceFrom: /revision
    hidden: true
  - id: system
    label: 시스템
    files: []
    selections:
      - files:
          - data/system-design-v1.json
        records: /systems
        layer: designed-v1
        references: false
        namespaceFrom: /revision
  - id: wave
    label: 구현 웨이브
    files: []
    selections:
      - files:
          - data/system-design-v1.json
        records: /implementationWaves
        layer: designed-v1
        references: false
        namespaceFrom: /revision
    hidden: true
  - id: catalog
    label: 카탈로그 원본
    files: []
    selections:
      - files:
          - data/system-design-v1.json
        records: ""
        layer: designed-v1
        references: false
        idField: revision
        namespaceFrom: /revision
    hidden: true
  - id: reward-source
    label: 결산 보상 규칙
    files: []
    selections:
      - files:
          - data/meta/progression.json
        records: /economy/rewardRules
        layer: runtime
        references: false
        nameField: materialId
  - id: estate
    label: 영지
    files: []
    selections:
      - files:
          - data/estates/*.json
        layer: runtime
  - id: hero
    label: 영웅
    files: []
    selections:
      - files:
          - data/heroes/*.json
        layer: runtime
  - id: waveRuntime
    label: 실행 원본
    files: []
    hidden: true
    selections:
      - files:
          - data/runtime/wave-1a.json
        records: ""
        idField: designRevision
        layer: runtime-programs
        references: false
derived:
  - id: waveProgramCatalog
    scope: graph
    value:
      op: lookup
      kind: waveProgramCatalog
      field:
        - layer
      equals: runtime-programs
  - id: executableParams
    scope: node
    kinds:
      - waveProgram
    layer: runtime-programs
    value:
      op: at
      object:
        op: at
        object:
          op: get
          from: vars
          path:
            - waveProgramCatalog
            - programs
        key:
          op: get
          from: node
          path:
            - originalId
      key: params
  - id: catalog
    scope: graph
    value:
      op: lookup
      kind: catalog
      field:
        - layer
      equals: designed-v1
  - id: profile
    scope: graph
    value:
      op: lookup
      kind: profile
      field:
        - originalId
      equals: core:first_playable
  - id: selected
    scope: node
    kinds:
      - weapon
      - tool
      - charter
      - item
      - evolution
      - enemy
      - vassal
    value:
      op: case
      cases:
        - when:
            op: eq
            left:
              op: get
              from: node
              path:
                - kind
            right: weapon
          value:
            op: in
            value:
              op: get
              from: node
              path:
                - originalId
            collection:
              op: get
              from: vars
              path:
                - profile
                - selection
                - weapons
        - when:
            op: eq
            left:
              op: get
              from: node
              path:
                - kind
            right: tool
          value:
            op: in
            value:
              op: get
              from: node
              path:
                - originalId
            collection:
              op: get
              from: vars
              path:
                - profile
                - selection
                - tools
        - when:
            op: eq
            left:
              op: get
              from: node
              path:
                - kind
            right: charter
          value:
            op: in
            value:
              op: get
              from: node
              path:
                - originalId
            collection:
              op: get
              from: vars
              path:
                - profile
                - runtime
                - charters
        - when:
            op: eq
            left:
              op: get
              from: node
              path:
                - kind
            right: item
          value:
            op: in
            value:
              op: get
              from: node
              path:
                - originalId
            collection:
              op: get
              from: vars
              path:
                - profile
                - runtime
                - items
        - when:
            op: eq
            left:
              op: get
              from: node
              path:
                - kind
            right: evolution
          value:
            op: in
            value:
              op: get
              from: node
              path:
                - originalId
            collection:
              op: get
              from: vars
              path:
                - profile
                - runtime
                - evolutions
        - when:
            op: eq
            left:
              op: get
              from: node
              path:
                - kind
            right: enemy
          value:
            op: in
            value:
              op: get
              from: node
              path:
                - originalId
            collection:
              op: get
              from: vars
              path:
                - profile
                - selection
                - enemies
        - when:
            op: eq
            left:
              op: get
              from: node
              path:
                - kind
            right: vassal
          value:
            op: in
            value:
              op: get
              from: node
              path:
                - originalId
            collection:
              op: literal
              value: []
      default: false
  - id: depth
    scope: node
    kinds:
      - weapon
      - tool
      - charter
      - item
      - evolution
      - enemy
      - vassal
    value:
      op: case
      cases:
        - when:
            op: not
            value:
              op: get
              from: vars
              path:
                - selected
          value: design
        - when:
            op: any
            input:
              op: get
              from: node
              path:
                - runtimeProjection
                - effects
            where:
              op: ne
              left:
                op: get
                from: item
                path:
                  - operation
              right: stat-add
          value: unique
        - when:
            op: in
            value:
              op: get
              from: node
              path:
                - kind
            collection:
              op: literal
              value:
                - weapon
                - tool
                - enemy
          value: base
        - when:
            op: and
            values:
              - op: gt
                left:
                  op: count
                  value:
                    op: get
                    from: node
                    path:
                      - runtimeProjection
                      - effects
                right: 0
              - op: all
                input:
                  op: get
                  from: node
                  path:
                    - runtimeProjection
                    - effects
                where:
                  op: eq
                  left:
                    op: get
                    from: item
                    path:
                      - operation
                  right: stat-add
          value: stat
      default: design
  - id: effectiveProjection
    scope: node
    kinds:
      - weapon
      - tool
      - charter
      - item
      - evolution
      - enemy
      - vassal
    layer: runtime
    value:
      op: coalesce
      values:
        - op: at
          object:
            op: get
            from: vars
            path:
              - profile
              - runtimeOverrides
              - equipment
          key:
            op: get
            from: node
            path:
              - originalId
        - op: at
          object:
            op: get
            from: vars
            path:
              - profile
              - runtimeOverrides
              - charters
          key:
            op: get
            from: node
            path:
              - originalId
        - op: at
          object:
            op: get
            from: vars
            path:
              - profile
              - runtimeOverrides
              - items
          key:
            op: get
            from: node
            path:
              - originalId
        - op: at
          object:
            op: get
            from: vars
            path:
              - profile
              - runtimeOverrides
              - evolutions
          key:
            op: get
            from: node
            path:
              - originalId
        - op: get
          from: node
          path:
            - runtimeProjection
  - id: waveIndex
    scope: node
    value:
      op: indexOf
      input:
        op: map
        input:
          op: get
          from: vars
          path:
            - catalog
            - implementationWaves
        value:
          op: get
          from: item
          path:
            - id
      value:
        op: at
        object:
          op: map
          input:
            op: filter
            input:
              op: get
              from: vars
              path:
                - catalog
                - implementationWaves
            where:
              op: in
              value:
                op: get
                from: node
                path:
                  - originalId
              collection:
                op: concat
                values:
                  - op: get
                    from: item
                    path:
                      - contentIds
                  - op: get
                    from: item
                    path:
                      - systemIds
          value:
            op: get
            from: item
            path:
              - id
        key: 0
    layer: designed-v1
  - id: effectiveDepth
    scope: node
    kinds:
      - weapon
      - tool
      - charter
      - item
      - evolution
      - enemy
      - vassal
    layer: runtime
    value:
      op: case
      cases:
        - when:
            op: not
            value:
              op: get
              from: vars
              path:
                - selected
          value: design
        - when:
            op: any
            input:
              op: get
              from: vars
              path:
                - effectiveProjection
                - effects
            where:
              op: ne
              left:
                op: get
                from: item
                path:
                  - operation
              right: stat-add
          value: unique
        - when:
            op: in
            value:
              op: get
              from: node
              path:
                - kind
            collection:
              op: literal
              value:
                - weapon
                - tool
                - enemy
          value: base
        - when:
            op: and
            values:
              - op: gt
                left:
                  op: count
                  value:
                    op: get
                    from: vars
                    path:
                      - effectiveProjection
                      - effects
                right: 0
              - op: all
                input:
                  op: get
                  from: vars
                  path:
                    - effectiveProjection
                    - effects
                where:
                  op: eq
                  left:
                    op: get
                    from: item
                    path:
                      - operation
                  right: stat-add
          value: stat
      default: design
  - id: waveRuntime
    scope: graph
    value:
      op: lookup
      kind: waveRuntime
      field:
        - layer
      equals: runtime-programs
  - id: humanBindings
    scope: node
    kinds: &a1
      - weapon
      - tool
      - item
      - evolution
      - enemy
      - chapter
      - charter
      - vassal
      - material
      - manor
    layer: designed-v1
    value:
      op: filter
      input:
        op: get
        from: vars
        path:
          - waveRuntime
          - bindings
      where:
        op: and
        values:
          - op: eq
            left:
              op: get
              from: item
              path:
                - kind
            right:
              op: get
              from: node
              path:
                - kind
          - op: eq
            left:
              op: get
              from: item
              path:
                - designRef
                - catalog
            right: data/system-design-v1.json
          - op: eq
            left:
              op: get
              from: item
              path:
                - designRef
                - revision
            right:
              op: get
              from: vars
              path:
                - catalog
                - revision
          - op: eq
            left:
              op: get
              from: item
              path:
                - designRef
                - id
            right:
              op: get
              from: node
              path:
                - originalId
          - op: eq
            left:
              op: get
              from: item
              path:
                - id
            right:
              op: get
              from: node
              path:
                - originalId
          - op: exists
            value:
              op: at
              object:
                op: get
                from: vars
                path:
                  - waveRuntime
                  - definition
                  - programs
              key:
                op: get
                from: item
                path:
                  - id
  - id: humanProgramState
    scope: node
    kinds: *a1
    layer: designed-v1
    value:
      op: case
      cases:
        - when:
            op: gt
            left:
              op: count
              value:
                op: get
                from: vars
                path:
                  - humanBindings
            right: 0
          value: wave-1a 실행 프로그램 있음
      default: wave-1a 실행 프로그램 없음
  - id: humanEvolutions
    scope: node
    kinds: *a1
    layer: designed-v1
    value:
      op: map
      input:
        op: filter
        input:
          op: get
          from: vars
          path:
            - catalog
            - content
        where:
          op: and
          values:
            - op: eq
              left:
                op: get
                from: item
                path:
                  - kind
              right: evolution
            - op: in
              value:
                op: get
                from: node
                path:
                  - originalId
              collection:
                op: coalesce
                values:
                  - op: get
                    from: item
                    path:
                      - inputIds
                  - op: literal
                    value: []
      value:
        op: let
        bindings:
          evolution:
            op: get
            from: item
            path:
              - name
          inputs:
            op: get
            from: item
            path:
              - inputIds
        value:
          op: concat
          values:
            - op: get
              from: vars
              path:
                - evolution
            - " ← "
            - op: join
              input:
                op: map
                input:
                  op: filter
                  input:
                    op: get
                    from: vars
                    path:
                      - catalog
                      - content
                  where:
                    op: in
                    value:
                      op: get
                      from: item
                      path:
                        - id
                    collection:
                      op: get
                      from: vars
                      path:
                        - inputs
                value:
                  op: get
                  from: item
                  path:
                    - name
              separator: " + "
  - id: humanItems
    scope: node
    kinds: *a1
    layer: designed-v1
    value:
      op: map
      input:
        op: filter
        input:
          op: get
          from: vars
          path:
            - catalog
            - content
        where:
          op: and
          values:
            - op: eq
              left:
                op: get
                from: item
                path:
                  - kind
              right: item
            - op: or
              values:
                - op: in
                  value:
                    op: get
                    from: node
                    path:
                      - originalId
                  collection:
                    op: coalesce
                    values:
                      - op: get
                        from: item
                        path:
                          - linkedToolIds
                      - op: literal
                        value: []
                - op: in
                  value:
                    op: get
                    from: node
                    path:
                      - originalId
                  collection:
                    op: coalesce
                    values:
                      - op: get
                        from: item
                        path:
                          - linkedWeaponIds
                      - op: literal
                        value: []
      value:
        op: get
        from: item
        path:
          - name
  - id: humanSources
    scope: node
    kinds:
      - material
    layer: designed-v1
    value:
      op: map
      input:
        op: coalesce
        values:
          - op: get
            from: node
            path:
              - sources
          - op: literal
            value: []
      value:
        op: let
        bindings:
          endpoint:
            op: get
            from: item
            path:
              - contentId
        value:
          op: concat
          values:
            - op: join
              input:
                op: map
                input:
                  op: filter
                  input:
                    op: get
                    from: vars
                    path:
                      - catalog
                      - content
                  where:
                    op: eq
                    left:
                      op: get
                      from: item
                      path:
                        - id
                    right:
                      op: get
                      from: vars
                      path:
                        - endpoint
                value:
                  op: get
                  from: item
                  path:
                    - name
              separator: ""
            - " · "
            - op: get
              from: item
              path:
                - action
  - id: humanSinks
    scope: node
    kinds:
      - material
    layer: designed-v1
    value:
      op: map
      input:
        op: coalesce
        values:
          - op: get
            from: node
            path:
              - sinks
          - op: literal
            value: []
      value:
        op: let
        bindings:
          endpoint:
            op: get
            from: item
            path:
              - contentId
        value:
          op: concat
          values:
            - op: join
              input:
                op: map
                input:
                  op: filter
                  input:
                    op: get
                    from: vars
                    path:
                      - catalog
                      - content
                  where:
                    op: eq
                    left:
                      op: get
                      from: item
                      path:
                        - id
                    right:
                      op: get
                      from: vars
                      path:
                        - endpoint
                value:
                  op: get
                  from: item
                  path:
                    - name
              separator: ""
            - " · "
            - op: get
              from: item
              path:
                - action
  - id: mapEquipment
    scope: node
    kinds: &a1
      - weapon
      - tool
      - item
      - charter
      - evolution
      - vassal
      - material
      - manor
      - chapter
      - enemy
    layer: designed-v1
    value:
      op: filter
      input:
        op: get
        from: vars
        path:
          - catalog
          - content
      where:
        op: and
        values:
          - op: in
            value: &a3
              op: get
              from: item
              path:
                - kind
            collection:
              op: literal
              value:
                - tool
                - weapon
          - op: in
            value:
              op: get
              from: item
              path:
                - id
            collection:
              op: concat
              values:
                - op: coalesce
                  values:
                    - op: get
                      from: node
                      path:
                        - inputIds
                    - op: literal
                      value: []
                - op: coalesce
                  values:
                    - op: get
                      from: node
                      path:
                        - linkedToolIds
                    - op: literal
                      value: []
                - op: coalesce
                  values:
                    - op: get
                      from: node
                      path:
                        - linkedWeaponIds
                    - op: literal
                      value: []
  - id: mapHubs
    scope: node
    kinds: *a1
    layer: designed-v1
    value:
      op: case
      cases:
        - when:
            op: eq
            left: &a2
              op: get
              from: node
              path:
                - kind
            right: tool
          value:
            op: unique
            value:
              op: concat
              values:
                - op: map
                  input:
                    op: literal
                    value:
                      - 0
                  value:
                    op: coalesce
                    values:
                      - op: at
                        object:
                          op: literal
                          value:
                            land: core:system_land
                            building: core:system_building
                            people: core:system_people
                        key:
                          op: get
                          from: node
                          path:
                            - targetKind
                      - core:system_tool
                - op: literal
                  value:
                    - core:system_tool
        - when:
            op: in
            value: *a2
            collection:
              op: literal
              value:
                - item
                - charter
                - evolution
          value:
            op: case
            cases:
              - when:
                  op: gt
                  left:
                    op: count
                    value:
                      op: get
                      from: vars
                      path:
                        - mapEquipment
                  right: 0
                value:
                  op: unique
                  value:
                    op: concat
                    values:
                      - op: map
                        input:
                          op: filter
                          input:
                            op: get
                            from: vars
                            path:
                              - mapEquipment
                          where:
                            op: eq
                            left: *a3
                            right: tool
                        value:
                          op: coalesce
                          values:
                            - op: at
                              object:
                                op: literal
                                value:
                                  land: core:system_land
                                  building: core:system_building
                                  people: core:system_people
                              key:
                                op: get
                                from: item
                                path:
                                  - targetKind
                            - core:system_tool
                      - op: map
                        input:
                          op: filter
                          input:
                            op: get
                            from: vars
                            path:
                              - mapEquipment
                          where:
                            op: eq
                            left: *a3
                            right: weapon
                        value: core:system_weapon
                      - op: map
