views:
  - id: primitive-support
    type: table
    label: 공통 동작 단위 지원
    description: 지정 조합의 정적 지원만 표시합니다. 실행·의미·화면은 미판정입니다. 노드를 누르면 정확한 파라미터·처리기·검사 경로를 읽을 수 있습니다.
    query:
      kinds: [runtimePrimitive]
      layer: runtime-support
    columns:
      - id: staticSupport
        label: 정적 지원
        value:
          op: get
          from: node
          path: [staticSupport]
      - id: referenceSummary
        label: 선택 설계 / 실행 참조
        value:
          op: get
          from: node
          path: [referenceSummary]
      - id: parameterSummary
        label: 허용 조합
        value:
          op: get
          from: node
          path: [parameterSummary]
      - id: limitation
        label: 지원 제한
        value:
          op: get
          from: node
          path: [limitation]
  - id: primitive-support-counts
    type: distribution
    label: 단위별 정적 지원 경계
    query:
      kinds: [runtimePrimitive]
      layer: runtime-support
    groupBy:
      op: get
      from: node
      path: [staticSupport]
  - id: designed-influence
    type: matrix
    label: 설계 시스템 영향 행렬
    description: 행 시스템 → 열 시스템. 제안된 직접 영향이며 현재 실행 호출 관계가 아닙니다.
    query:
      kinds:
        - system
      layer: designed-v1
    edgeKinds:
      - system-influence
  - id: sink-cost-matrix
    type: table
    label: 소비처 × 재료 기본 비용 행렬
    description: 숫자는 기본 비용이다. 레벨별 추가 비용과 실제 경제 결과는 별도다.
    query:
      kinds:
        - manor
        - vassal
      layer: runtime
    columns:
      - id: name
        label: 소비처
        value:
          op: get
          from: node
          path:
            - name
      - id: grain
        label: grain
        value:
          op: at
          object:
            op: coalesce
            values:
              - op: get
                from: node
                path:
                  - baseCost
              - op: get
                from: node
                path:
                  - levelCostBase
          key: meta:grain
      - id: timber
        label: timber
        value:
          op: at
          object:
            op: coalesce
            values:
              - op: get
                from: node
                path:
                  - baseCost
              - op: get
                from: node
                path:
                  - levelCostBase
          key: meta:timber
      - id: iron
        label: iron
        value:
          op: at
          object:
            op: coalesce
            values:
              - op: get
