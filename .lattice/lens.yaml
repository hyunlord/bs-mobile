schemaVersion: 1
name: Sow & Siege · 콘텐츠 지도
kinds:
  - id: waveProgram
    label: wave-1a 실행 프로그램
    files: []
    selections:
      - files: [data/runtime/wave-1a.json]
        records: /bindings
        layer: runtime-programs
        references: false
  - id: waveProgramCatalog
    label: 실행 프로그램 원본
    files: []
    hidden: true
    selections:
      - files: [data/runtime/wave-1a.json]
        records: /definition
        idField: revision
        layer: runtime-programs
        references: false
  - id: runtimePrimitive
    label: 실행 동작 단위
    files: []
    columns: [name, staticSupport, limitation]
    selections:
      - files: [docs/design/runtime-primitive-support.json]
        records: /units
        layer: runtime-support
        references: false
  - id: weapon
    label: 무기
    files: []
    columns:
      - name
      - concept
    selections:
      - files:
          - data/weapons/*.json
        layer: runtime
  - id: tool
    label: 도구
    files: []
    columns:
      - name
      - concept
    selections:
      - files:
          - data/tools/*.json
        layer: runtime
  - id: charter
    label: 특허장
    files: []
    columns:
      - name
      - concept
    selections:
      - files:
          - data/charters/*.json
        layer: runtime
  - id: item
    label: 물품
    files: []
    columns:
      - name
      - concept
    selections:
      - files:
          - data/items/*.json
        layer: runtime
  - id: evolution
    label: 진화
    files: []
    columns:
      - name
      - concept
    selections:
      - files:
          - data/evolutions/*.json
        layer: runtime
  - id: enemy
    label: 적
    files: []
    columns:
      - name
      - concept
    selections:
      - files:
          - data/enemies/*.json
        layer: runtime
  - id: vassal
    label: 가신
    files: []
    columns:
      - name
      - concept
    selections:
      - files:
          - data/vassals/*.json
        layer: candidate
        references: false
      - files:
          - data/meta/progression.json
        records: /vassals
        layer: runtime
  - id: profile
    label: 실행 프로필
    files: []
    hidden: true
    selections:
      - files:
          - data/profiles/first-playable.json
        layer: runtime
  - id: material
    label: 재료
    files: []
    selections:
      - files:
          - data/meta/progression.json
        records: /materials
        layer: runtime
  - id: chapter
    label: 챕터
    files: []
    selections:
      - files:
          - data/meta/progression.json
        records: /chapters
        layer: runtime
  - id: manor
    label: 장원
    files: []
    selections:
      - files:
          - data/meta/progression.json
        records: /manorBuildings
        layer: runtime
  - id: challenge
    label: 도전
    files: []
    selections:
      - files:
          - data/meta/progression.json
        records: /challenges
        layer: runtime
  - id: content
    label: 설계 콘텐츠
    files: []
    selections:
      - files:
          - data/system-design-v1.json
        records: /content
        kindField: kind
        layer: designed-v1
        references: false
        namespaceFrom: /revision
    hidden: true
  - id: system
    label: 시스템
    files: []
    selections:
      - files:
          - data/system-design-v1.json
        records: /systems
        layer: designed-v1
        references: false
        namespaceFrom: /revision
  - id: wave
    label: 구현 웨이브
    files: []
    selections:
      - files:
          - data/system-design-v1.json
        records: /implementationWaves
        layer: designed-v1
        references: false
        namespaceFrom: /revision
    hidden: true
  - id: catalog
    label: 카탈로그 원본
    files: []
    selections:
      - files:
          - data/system-design-v1.json
        records: ""
        layer: designed-v1
        references: false
        idField: revision
        namespaceFrom: /revision
    hidden: true
  - id: reward-source
    label: 결산 보상 규칙
    files: []
    selections:
      - files:
          - data/meta/progression.json
        records: /economy/rewardRules
        layer: runtime
        references: false
        nameField: materialId
  - id: estate
    label: 영지
    files: []
    selections:
      - files:
          - data/estates/*.json
        layer: runtime
  - id: hero
    label: 영웅
    files: []
    selections:
      - files:
          - data/heroes/*.json
        layer: runtime
derived:
  - id: waveProgramCatalog
    scope: graph
    value:
      op: lookup
      kind: waveProgramCatalog
      field: [layer]
      equals: runtime-programs
  - id: executableParams
    scope: node
    kinds: [waveProgram]
    layer: runtime-programs
    value:
      op: at
      object:
        op: at
        object:
          op: get
          from: vars
          path: [waveProgramCatalog, programs]
        key:
          op: get
          from: node
          path: [originalId]
      key: params
  - id: catalog
    scope: graph
    value:
      op: lookup
      kind: catalog
      field:
        - layer
      equals: designed-v1
  - id: profile
    scope: graph
    value:
      op: lookup
      kind: profile
      field:
        - originalId
      equals: core:first_playable
  - id: selected
    scope: node
    kinds:
      - weapon
      - tool
      - charter
      - item
      - evolution
      - enemy
      - vassal
    value:
      op: case
      cases:
        - when:
            op: eq
            left:
              op: get
              from: node
              path:
                - kind
            right: weapon
          value:
            op: in
            value:
              op: get
              from: node
              path:
                - originalId
            collection:
              op: get
              from: vars
              path:
                - profile
                - selection
                - weapons
        - when:
            op: eq
            left:
              op: get
              from: node
              path:
                - kind
            right: tool
          value:
            op: in
            value:
              op: get
              from: node
              path:
                - originalId
            collection:
              op: get
              from: vars
              path:
                - profile
                - selection
                - tools
        - when:
            op: eq
            left:
              op: get
              from: node
              path:
                - kind
            right: charter
          value:
            op: in
            value:
              op: get
              from: node
              path:
                - originalId
            collection:
              op: get
              from: vars
              path:
                - profile
                - runtime
                - charters
        - when:
            op: eq
            left:
              op: get
              from: node
              path:
                - kind
            right: item
          value:
            op: in
            value:
              op: get
              from: node
              path:
                - originalId
            collection:
              op: get
              from: vars
              path:
                - profile
                - runtime
                - items
        - when:
            op: eq
            left:
              op: get
              from: node
              path:
                - kind
            right: evolution
          value:
            op: in
            value:
              op: get
              from: node
              path:
                - originalId
            collection:
              op: get
              from: vars
              path:
                - profile
                - runtime
                - evolutions
        - when:
            op: eq
            left:
              op: get
              from: node
              path:
                - kind
            right: enemy
          value:
            op: in
            value:
              op: get
              from: node
              path:
                - originalId
            collection:
              op: get
              from: vars
              path:
                - profile
                - selection
                - enemies
        - when:
            op: eq
            left:
              op: get
              from: node
              path:
                - kind
            right: vassal
          value:
            op: in
            value:
              op: get
              from: node
              path:
                - originalId
            collection:
              op: literal
              value: []
      default: false
  - id: depth
    scope: node
    kinds:
      - weapon
      - tool
      - charter
      - item
      - evolution
      - enemy
      - vassal
    value:
      op: case
      cases:
        - when:
            op: not
            value:
              op: get
              from: vars
              path:
                - selected
          value: design
        - when:
            op: any
            input:
              op: get
              from: node
              path:
                - runtimeProjection
                - effects
            where:
              op: ne
              left:
                op: get
                from: item
                path:
                  - operation
              right: stat-add
          value: unique
        - when:
            op: in
            value:
              op: get
              from: node
              path:
                - kind
            collection:
              op: literal
              value:
                - weapon
                - tool
                - enemy
          value: base
        - when:
            op: and
            values:
              - op: gt
                left:
                  op: count
                  value:
                    op: get
                    from: node
                    path:
                      - runtimeProjection
                      - effects
                right: 0
              - op: all
                input:
                  op: get
                  from: node
                  path:
                    - runtimeProjection
                    - effects
                where:
                  op: eq
                  left:
                    op: get
                    from: item
                    path:
                      - operation
                  right: stat-add
          value: stat
      default: design
  - id: effectiveProjection
    scope: node
    kinds:
      - weapon
      - tool
      - charter
      - item
      - evolution
      - enemy
      - vassal
    layer: runtime
    value:
      op: coalesce
      values:
        - op: at
          object:
            op: get
            from: vars
            path:
              - profile
              - runtimeOverrides
              - equipment
          key:
            op: get
            from: node
            path:
              - originalId
        - op: at
          object:
            op: get
            from: vars
            path:
              - profile
              - runtimeOverrides
              - charters
          key:
            op: get
            from: node
            path:
              - originalId
        - op: at
          object:
            op: get
            from: vars
            path:
              - profile
              - runtimeOverrides
              - items
          key:
            op: get
            from: node
            path:
              - originalId
        - op: at
          object:
            op: get
            from: vars
            path:
              - profile
              - runtimeOverrides
              - evolutions
          key:
            op: get
            from: node
            path:
              - originalId
        - op: get
          from: node
          path:
            - runtimeProjection
  - id: waveIndex
    scope: node
    value:
      op: indexOf
      input:
        op: map
        input:
          op: get
          from: vars
          path:
            - catalog
            - implementationWaves
        value:
          op: get
          from: item
          path:
            - id
      value:
        op: at
        object:
          op: map
          input:
            op: filter
            input:
              op: get
              from: vars
              path:
                - catalog
                - implementationWaves
            where:
              op: in
              value:
                op: get
                from: node
                path:
                  - originalId
              collection:
                op: concat
                values:
                  - op: get
                    from: item
                    path:
                      - contentIds
                  - op: get
                    from: item
                    path:
                      - systemIds
          value:
            op: get
            from: item
            path:
              - id
        key: 0
    layer: designed-v1
  - id: effectiveDepth
    scope: node
    kinds:
      - weapon
      - tool
      - charter
      - item
      - evolution
      - enemy
      - vassal
    layer: runtime
    value:
      op: case
      cases:
        - when:
            op: not
            value:
              op: get
              from: vars
              path:
                - selected
          value: design
        - when:
            op: any
            input:
              op: get
              from: vars
              path:
                - effectiveProjection
                - effects
            where:
              op: ne
              left:
                op: get
                from: item
                path:
                  - operation
              right: stat-add
          value: unique
        - when:
            op: in
            value:
              op: get
              from: node
              path:
                - kind
            collection:
              op: literal
              value:
                - weapon
                - tool
                - enemy
          value: base
        - when:
            op: and
            values:
              - op: gt
                left:
                  op: count
                  value:
                    op: get
                    from: vars
                    path:
                      - effectiveProjection
                      - effects
                right: 0
              - op: all
                input:
                  op: get
                  from: vars
                  path:
                    - effectiveProjection
                    - effects
                where:
                  op: eq
                  left:
                    op: get
                    from: item
                    path:
                      - operation
                  right: stat-add
          value: stat
      default: design
facets:
  - id: primitive-static-support
    key: primitiveStaticSupport
    kinds: [runtimePrimitive]
    layer: runtime-support
    value:
      op: get
      from: node
      path: [staticSupport]
  - id: selected
    key: selected
    kinds:
      - weapon
      - tool
      - charter
      - item
      - evolution
      - enemy
      - vassal
    value:
      op: case
      cases:
        - when:
            op: eq
            left:
              op: get
              from: node
              path:
                - layer
            right: runtime
          value:
            op: get
            from: vars
            path:
              - selected
      default: null
    layer: runtime
  - id: reference-depth
    key: referenceDepth
    kinds:
      - weapon
      - tool
      - charter
      - item
      - evolution
      - enemy
      - vassal
    value:
      op: case
      cases:
        - when:
            op: eq
            left:
              op: get
              from: node
              path:
                - layer
            right: runtime
          value:
            op: get
            from: vars
            path:
              - depth
      default: null
    layer: runtime
  - id: layer
    key: layer
    value:
      op: get
      from: node
      path:
        - layer
  - id: implementation-wave
    key: wave
    value:
      op: case
      cases:
        - when:
            op: eq
            left:
              op: get
              from: node
              path:
                - layer
            right: designed-v1
          value:
            op: map
            input:
              op: filter
              input:
                op: get
                from: vars
                path:
                  - catalog
                  - implementationWaves
              where:
                op: in
                value:
                  op: get
                  from: node
                  path:
                    - originalId
                collection:
                  op: concat
                  values:
                    - op: get
                      from: item
                      path:
                        - contentIds
                    - op: get
                      from: item
                      path:
                        - systemIds
            value:
              op: get
              from: item
              path:
                - id
      default: null
    layer: designed-v1
  - id: linked-item-count
    key: linkedItems
    kinds:
      - weapon
      - tool
    value:
      op: case
      cases:
        - when:
            op: eq
            left:
              op: get
              from: node
              path:
                - layer
            right: designed-v1
          value:
            op: count
            value:
              op: unique
              value:
                op: map
                input:
                  op: filter
                  input:
                    op: get
                    from: graph
                    path:
                      - nodes
                  where:
                    op: and
                    values:
                      - op: eq
                        left:
                          op: get
                          from: item
                          path:
                            - kind
                        right: item
                      - op: eq
                        left:
                          op: get
                          from: item
                          path:
                            - layer
                        right: designed-v1
                      - op: not
                        value:
                          op: eq
                          left:
                            op: get
                            from: item
                            path:
                              - itemScope
                          right: universal
                      - op: or
                        values:
                          - op: in
                            value:
                              op: get
                              from: node
                              path:
                                - id
                            collection: &a1
                              op: case
                              cases:
                                - when:
                                    op: eq
                                    left:
                                      op: get
                                      from: node
                                      path:
                                        - kind
                                    right: tool
                                  value:
                                    op: get
                                    from: item
                                    path:
                                      - linkedToolIds
                              default:
                                op: get
                                from: item
                                path:
                                  - linkedWeaponIds
                          - op: in
                            value:
                              op: get
                              from: node
                              path:
                                - originalId
                            collection: *a1
                value:
                  op: get
                  from: item
                  path:
                    - id
      default: null
    layer: designed-v1
  - id: candidate-reference-depth
    key: referenceDepth
    kinds:
      - vassal
    layer: candidate
    value:
      op: get
      from: vars
      path:
        - depth
  - id: candidate-selected
    key: selected
    kinds:
      - vassal
    layer: candidate
    value:
      op: get
      from: vars
      path:
        - selected
  - id: effective-depth
    key: effectiveDepth
    kinds:
      - weapon
      - tool
      - charter
      - item
      - evolution
      - enemy
      - vassal
    layer: runtime
    value:
      op: get
      from: vars
      path:
        - effectiveDepth
  - id: effective-effects
    key: effectiveEffects
    kinds:
      - weapon
      - tool
      - charter
      - item
      - evolution
      - enemy
      - vassal
    layer: runtime
    value:
      op: get
      from: vars
      path:
        - effectiveProjection
        - effects
  - id: design-intent
    key: designIntent
    kinds:
      - weapon
      - tool
      - charter
      - item
      - evolution
      - enemy
      - vassal
    value:
      op: get
      from: node
      path:
        - effect
findings:
  - id: item-stat-projection
    query:
      kinds:
        - item
      where:
        op: get
        from: vars
        path:
          - selected
      layer: runtime
    metrics:
      selected:
        op: count
        value:
          op: get
          from: vars
          path:
            - targets
      stat:
        op: count
        value:
          op: filter
          input:
            op: get
            from: vars
            path:
              - targets
          where:
            op: and
            values:
              - op: gt
                left:
                  op: count
                  value:
                    op: get
                    from: item
                    path:
                      - runtimeProjection
                      - effects
                right: 0
              - op: all
                input:
                  op: get
                  from: item
                  path:
                    - runtimeProjection
                    - effects
                where:
                  op: eq
                  left:
                    op: get
                    from: item
                    path:
                      - operation
                  right: stat-add
      layer: runtime
      content:
        op: count
        value:
          op: filter
          input:
            op: get
            from: graph
            path:
              - nodes
          where:
            op: and
            values:
              - op: in
                value:
                  op: get
                  from: item
                  path:
                    - kind
                collection:
                  op: literal
                  value:
                    - weapon
                    - tool
                    - charter
                    - item
                    - evolution
                    - enemy
                    - vassal
              - op: or
                values:
                  - op: and
                    values:
                      - op: eq
                        left:
                          op: get
                          from: item
                          path:
                            - layer
                        right: runtime
                      - op: ne
                        left:
                          op: get
                          from: item
                          path:
                            - kind
                        right: vassal
                  - op: and
                    values:
                      - op: eq
                        left:
                          op: get
                          from: item
                          path:
                            - layer
                        right: candidate
                      - op: eq
                        left:
                          op: get
                          from: item
                          path:
                            - kind
                        right: vassal
      profileSelected:
        op: count
        value:
          op: concat
          values:
            - op: get
              from: vars
              path:
                - profile
                - selection
                - weapons
            - op: get
              from: vars
              path:
                - profile
                - selection
                - tools
            - op: get
              from: vars
              path:
                - profile
                - selection
                - enemies
            - op: get
              from: vars
              path:
                - profile
                - runtime
                - charters
            - op: get
              from: vars
              path:
                - profile
                - runtime
                - items
            - op: get
              from: vars
              path:
                - profile
                - runtime
                - evolutions
      referenceUnique:
        op: count
        value:
          op: filter
          input:
            op: filter
            input:
              op: get
              from: graph
              path:
                - nodes
            where:
              op: and
              values:
                - op: in
                  value:
                    op: get
                    from: item
                    path:
                      - kind
                  collection:
                    op: literal
                    value:
                      - weapon
                      - tool
                      - charter
                      - item
                      - evolution
                      - enemy
                      - vassal
                - op: or
                  values:
                    - op: and
                      values:
                        - op: eq
                          left:
                            op: get
                            from: item
                            path:
                              - layer
                          right: runtime
                        - op: ne
                          left:
                            op: get
                            from: item
                            path:
                              - kind
                          right: vassal
                    - op: and
                      values:
                        - op: eq
                          left:
                            op: get
                            from: item
                            path:
                              - layer
                          right: candidate
                        - op: eq
                          left:
                            op: get
                            from: item
                            path:
                              - kind
                          right: vassal
          where:
            op: and
            values:
              - op: case
                cases:
                  - when:
                      op: eq
                      left:
                        op: get
                        from: item
                        path:
                          - kind
                      right: weapon
                    value:
                      op: in
                      value:
                        op: get
                        from: item
                        path:
                          - originalId
                      collection:
                        op: get
                        from: vars
                        path:
                          - profile
                          - selection
                          - weapons
                  - when:
                      op: eq
                      left:
                        op: get
                        from: item
                        path:
                          - kind
                      right: tool
                    value:
                      op: in
                      value:
                        op: get
                        from: item
                        path:
                          - originalId
                      collection:
                        op: get
                        from: vars
                        path:
                          - profile
                          - selection
                          - tools
                  - when:
                      op: eq
                      left:
                        op: get
                        from: item
                        path:
                          - kind
                      right: charter
                    value:
                      op: in
                      value:
                        op: get
                        from: item
                        path:
                          - originalId
                      collection:
                        op: get
                        from: vars
                        path:
                          - profile
                          - runtime
                          - charters
                  - when:
                      op: eq
                      left:
                        op: get
                        from: item
                        path:
                          - kind
                      right: item
                    value:
                      op: in
                      value:
                        op: get
                        from: item
                        path:
                          - originalId
                      collection:
                        op: get
                        from: vars
                        path:
                          - profile
                          - runtime
                          - items
                  - when:
                      op: eq
                      left:
                        op: get
                        from: item
