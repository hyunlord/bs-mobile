    severity: warning
    basis: authored-interpretation
    intent: "저자 해석: 장원 장치라는 이름과 의도에 비해 수치 덧셈은 플레이를 바꾸지 못한다는 비평이다. 예: 재 모으는 부적은 죽음의 흔적→비옥도라는 의도지만 원본 투영은 원거리 장비 조건의
      공격력 +3이다. 재미 또는 실행 결과의 측정값은 아니다."
    implementation: 원본 runtimeProjection과 first-playable 선택을 집계한다. effectiveEffects와
      codeSupport:runtime-operations는 프로필 우선 적용 및 실제 처리기 정적 근거를 별도로 표시한다.
