        values:
          - op: exists
            value:
              op: get
              from: node
              path:
                - designRef
          - op: gt
            left:
              op: count
              value:
                op: filter
                input:
                  op: get
                  from: graph
                  path:
                    - nodes
                where:
                  op: and
                  values:
