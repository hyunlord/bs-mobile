      columns:
        - name
        - concept
    - id: vassal
      label: 가신
      columns:
        - name
        - concept
    - id: profile
      label: 실행 프로필
      hidden: true
    - id: material
      label: 재료
    - id: chapter
      label: 챕터
    - id: manor
      label: 장원
    - id: challenge
      label: 도전
    - id: system
      label: 시스템
    - id: wave
      label: 구현 웨이브
      hidden: true
    - id: catalog
      label: 카탈로그 원본
      hidden: true
    - id: reward-source
      label: 결산 보상 규칙
    - id: estate
      label: 영지
    - id: hero
      label: 영웅
  facets:
    referenceDepth:
      label: 원본 구현 깊이
      values:
        design: 설계
        stat: 수치 효과
        base: 기본 동작
        unique: 고유 효과
    selected:
      label: 첫 플레이 선택
      values:
        "true": 선택됨
        "false": 미선택
    primitiveStaticSupport:
      label: 단위 지원 · 실행 관측 아님
